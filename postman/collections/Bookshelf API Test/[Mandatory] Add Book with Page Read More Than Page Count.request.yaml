$kind: http-request
url: http://localhost:{{port}}/books
method: POST
body:
  type: json
  content: "{\r

    \    \"name\": \"{{newName}}\",\r

    \    \"year\": {{newYear}},\r

    \    \"author\": \"{{newAuthor}}\",\r

    \    \"summary\": \"{{newSummary}}\",\r

    \    \"publisher\": \"{{newPublisher}}\",\r

    \    \"pageCount\": 80,\r

    \    \"readPage\": 90,\r

    \    \"reading\": {{newReading}}\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test('status code should be 400', () => {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test('response header Content-Type should be application/json', () =>
      {\r

      \    pm.expect(pm.response.headers.get('Content-Type')).to.equals('applic\
      ation/json; charset=utf-8');\r

      });\r

      \r

      pm.test('response body should be an object', () => {\r

      \    const responseJson = pm.response.json();\r

      \    pm.expect(responseJson).to.be.an('object');\r

      });\r

      \r

      pm.test('response body should have correct property and value', () => {\r

      \    const responseJson = pm.response.json();\r

      \    \r

      \    pm.expect(responseJson).to.haveOwnProperty('status');\r

      \    pm.expect(responseJson).to.haveOwnProperty('message');\r

      \    pm.expect(responseJson).to.not.haveOwnProperty('data');\r

      \r

      \    pm.expect(responseJson.status).to.equals('fail');\r

      \    pm.expect(responseJson.message).to.equals('Gagal menambahkan buku.
      readPage tidak boleh lebih besar dari pageCount');\r

      });"
    language: text/javascript
order: 4000
