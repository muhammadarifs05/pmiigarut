$kind: http-request
url: http://localhost:{{port}}/books/{{bookIdWithFinishedReading}}
method: DELETE
scripts:
  - type: afterResponse
    code: "pm.test('status code should be 200', () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('response header Content-Type should be application/json', () =>
      {\r

      \    pm.expect(pm.response.headers.get('Content-Type')).to.equals('applic\
      ation/json; charset=utf-8');\r

      });\r

      \r

      pm.test('response body should be an object', () => {\r

      \    const responseJson = pm.response.json();\r

      \    pm.expect(responseJson).to.be.an('object');\r

      });\r

      \r

      pm.test('response body should have correct property and value', () => {\r

      \    const responseJson = pm.response.json();\r

      \    \r

      \    pm.expect(responseJson).to.haveOwnProperty('status');\r

      \    pm.expect(responseJson).to.haveOwnProperty('message');\r

      \r

      \    pm.expect(responseJson.status).to.equals('success');\r

      \    pm.expect(responseJson.message).to.equals('Buku berhasil dihapus');\r

      });\r

      \r

      pm.test('when get detail books', () => {\r

      \    pm.sendRequest(`http://localhost:${pm.environment.get('port')}/books\
      /${pm.environment.get('bookIdWithFinishedReading')}`, (error, response) =>
      {\r

      \       pm.test('The book should be not found', () => {\r

      \          pm.expect(response.code).to.equals(404);\r

      \       }); \r

      \    });\r

      });"
